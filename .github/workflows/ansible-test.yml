name: ansible-test sanity
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  sanity:
    timeout-minutes: 30
    name: Ansible Sanity (Ⓐ${{ matrix.ansible }}) tests
    strategy:
      fail-fast: false
      matrix:
        include:
        # Keep in step with requires_ansible in meta/runtime.yml and tests/sanity/ignore-*.txt.
        # Red Hat certification runs sanity on ansible-core 2.16 with Python 3.12.
        - ansible: stable-2.16
          python: '3.12'
        - ansible: stable-2.17
          python: '3.12'
        - ansible: stable-2.18
          python: '3.12'
        - ansible: stable-2.19
          python: '3.12'
        - ansible: stable-2.20
          python: '3.12'
        - ansible: stable-2.21
          python: '3.12'
    runs-on: ubuntu-latest
    steps:
      - name: Perform testing
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          # pre-test-cmd:
          python-version: ${{ matrix.python }}
          target-python-version: ${{ matrix.python }}
          testing-type: sanity
          # test-deps:
